mixed-port: 7890
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://223.5.5.5/dns-query, https://119.29.29.29/dns-query]
  fake-ip-filter: ['*.lan', '*.local', '+.msftconnecttest.com', '+.msftncsi.com']
sniffer:
  enable: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880]}
proxies:
- name: CF隧道1
  type: vless
  server: geek-clinic-cigarettes-study.trycloudflare.com
  port: 443
  uuid: dc4d999b-2c0f-4a35-83dc-dc3376a364d0
  udp: false
  tls: true
  servername: geek-clinic-cigarettes-study.trycloudflare.com
  network: ws
  ws-opts:
    path: "/ws?ed=2048"
    headers: {Host: geek-clinic-cigarettes-study.trycloudflare.com}
    max-early-data: 2048
    early-data-header-name: Sec-WebSocket-Protocol
  client-fingerprint: chrome
  smux: {enabled: true, protocol: h2mux, max-connections: 4, padding: false}
- name: CF隧道2
  type: vless
  server: devel-conversation-auburn-coordinates.trycloudflare.com
  port: 443
  uuid: dc4d999b-2c0f-4a35-83dc-dc3376a364d0
  udp: false
  tls: true
  servername: devel-conversation-auburn-coordinates.trycloudflare.com
  network: ws
  ws-opts:
    path: "/ws?ed=2048"
    headers: {Host: devel-conversation-auburn-coordinates.trycloudflare.com}
    max-early-data: 2048
    early-data-header-name: Sec-WebSocket-Protocol
  client-fingerprint: chrome
  smux: {enabled: true, protocol: h2mux, max-connections: 4, padding: false}
proxy-groups:
- name: 自动
  type: fallback
  proxies: [CF隧道1, CF隧道2]
  url: "https://www.google.com/generate_204"
  interval: 180
- name: 选择
  type: select
  proxies: [自动, CF隧道1, CF隧道2, DIRECT]
rules:
- MATCH,选择
